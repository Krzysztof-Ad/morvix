name: PR title

# We squash-merge, so the pull-request title becomes the commit message. Enforce
# that it is a valid conventional commit (the same six types we use elsewhere).
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            docs
            test
          requireScope: false
          # Lowercase summary, no leading capital - matches our commit convention.
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject "{subject}" should start lowercase. Use the form
            "type: lowercase summary", e.g. "fix: handle empty stdin".
