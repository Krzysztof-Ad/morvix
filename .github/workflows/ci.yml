name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pushing again cancels the still-running checks of the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # valgrind is Linux-only; install it so the memory-correctness test runs
      # for real rather than skipping. gcc/g++ and rustc are preinstalled on the
      # GitHub runners, so the C/C++/Rust adapter tests run too. On Windows the
      # POSIX-only features (signals, checker scripts, raw commands) skip with
      # a reason instead of failing - the core judge/runner paths still run.
      - name: Install valgrind (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Coverage with a RATCHETED floor: when coverage rises, raise the number to
  # match (the floor only ever goes up). Runs on Linux with the full toolchain
  # so the measured number is stable run-to-run.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=morvix --cov-report=term --cov-fail-under=70

  # Lint, formatting and a lenient type check. Fast, no toolchains needed.
  # ruff config and the mypy settings live in pyproject.toml.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (format)
        run: ruff format --check .
      - name: mypy (type check)
        run: mypy
      - name: pip-audit (known CVEs in dependencies)
        # pip-audit audits the whole environment, including pip itself - keep
        # the tooling current so the gate only ever trips on real findings.
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit

  # Keep the committed GUIDE.md in sync with the tool. `docs --check`
  # regenerates the manual from the live command surface and fails if the
  # checked-in file is stale - so the docs can never quietly drift.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: morvix docs --check

  # The sacred path: prove a Receiver can run a package with ONLY system
  # python3 - no Morvix install anywhere. One job builds a package; a second,
  # deliberately Morvix-free, job unpacks it and runs ./run.sh.
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build a shareable package
        run: |
          mkdir demo && cd demo
          printf 'import sys\nprint(sum(int(x) for x in sys.stdin.read().split()))\n' > sol.py
          morvix init --name demo --language python
          morvix import sol.py
          morvix gen --random --shape ints --count 5 --seed 1
          morvix gen --expected
          morvix package --zip --out ../pkg.zip
          cp sol.py ../sol.py
      - uses: actions/upload-artifact@v7
        with:
          name: receiver-package
          path: |
            pkg.zip
            sol.py

  receiver-clean:
    needs: build-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: receiver-package
      # No checkout, no pip install: Morvix must not be present on this runner.
      - name: Confirm Morvix is absent
        run: |
          if python3 -c "import morvix" 2>/dev/null; then
            echo "morvix is importable here - this job must be Morvix-free"; exit 1
          fi
          echo "morvix is absent - good"
      - name: Unpack and run ./run.sh with only system python3
        run: |
          mkdir r && cd r
          unzip ../pkg.zip
          cp ../sol.py .
          sh run.sh sol.py | tee out.txt
          grep -q "passed" out.txt
