name: release-please

# Maintains a standing "release PR" that bumps the version (pyproject.toml and
# morvix/version.py) and updates CHANGELOG.md from conventional commits. Merging
# that PR tags the version and creates a GitHub Release - which triggers
# publish.yml (PyPI Trusted Publishing).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A PAT (RELEASE_PLEASE_TOKEN) is needed so the Release this creates
          # triggers publish.yml; falls back to GITHUB_TOKEN (which can open the
          # release PR but won't trigger the publish workflow).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
