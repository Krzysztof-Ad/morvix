# Optional local hooks that mirror CI. Install with:
#   pip install pre-commit && pre-commit install
# CI remains the source of truth; these just catch issues before you push.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff            # lint (and auto-fix what it safely can)
        args: [--fix]
      - id: ruff-format     # format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
