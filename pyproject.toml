[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morvix"
version = "0.5.0"
description = "A test-authoring, test-running, and test-sharing CLI for university programming assignments."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Krzysztof Adamczyk" }]
keywords = ["testing", "cli", "judge", "university", "assignments", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Krzysztof-Ad/morvix"
Repository = "https://github.com/Krzysztof-Ad/morvix"

[project.scripts]
morvix = "morvix.app:main"

[tool.hatch.build.targets.wheel]
packages = ["morvix"]

# The runner core ships verbatim inside every package, so it must travel as
# package data rather than importable code.
[tool.hatch.build.targets.wheel.force-include]
"morvix/runner_core/morvix_runner.py" = "morvix/runner_core/morvix_runner.py"
"morvix/runner_core/run.sh" = "morvix/runner_core/run.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
