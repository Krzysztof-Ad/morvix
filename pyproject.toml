[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morvix"
version = "0.8.0"
description = "A test-authoring, test-running, and test-sharing CLI for university programming assignments."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Krzysztof Adamczyk" }]
keywords = ["testing", "cli", "judge", "university", "assignments", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/Krzysztof-Ad/morvix"
Repository = "https://github.com/Krzysztof-Ad/morvix"

[project.scripts]
morvix = "morvix.app:main"

[tool.hatch.build.targets.wheel]
packages = ["morvix"]

# The runner core ships verbatim inside every package, so it must travel as
# package data rather than importable code.
[tool.hatch.build.targets.wheel.force-include]
"morvix/runner_core/morvix_runner.py" = "morvix/runner_core/morvix_runner.py"
"morvix/runner_core/run.sh" = "morvix/runner_core/run.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint + format with ruff. We keep the rule set conservative and high-signal so it
# catches real problems without fighting the deliberately hand-written, comment-heavy
# style. The formatter normalizes code spacing/quotes only - it leaves comments alone.
[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["GUIDE.md", "examples", "scratch"]

[tool.ruff.lint]
# F = pyflakes (unused imports, undefined names, broken f-strings),
# E9 = syntax errors, I = import sorting.
select = ["F", "E9", "I"]

[tool.ruff.lint.per-file-ignores]
# The runner core ships verbatim and must stay Python 3.6-compatible, so keep lint
# from ever nudging it toward newer idioms.
"morvix/runner_core/morvix_runner.py" = ["UP", "B", "C4", "SIM"]
# Test fixtures legitimately shadow names and import for side effects.
"tests/*" = ["F401", "F811"]

# A lenient type check over the package. The runner core (3.6-target, untyped) and the
# tests are excluded; we do not require annotations, we just catch real type mistakes.
[tool.mypy]
python_version = "3.9"
files = ["morvix"]
exclude = ['morvix/runner_core/', '^tests/']
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
